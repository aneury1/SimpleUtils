name: continuous-integration

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '.github/workflows/**'
      - '**/assets/**'
      - '**.md'
      - '.clang-format'
      - '.gitignore'
      - '.gitattributes'
    branches:
      - master
    types: [opened, synchronize]

jobs:
  continuous-integration:
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TYPE: Debug
    strategy:
      fail-fast: false
      matrix:
        # specify a specific compiler to build with each OS separately
        include:
          - platform_name: ubuntu
            os: ubuntu-latest
            cmake_generator: "Unix Makefiles"
          # - platform_name: macos
          #   os: macos-26-intel
          #   cxx: clang++
          #   cmake_generator: "Unix Makefiles"
          # NOTE: CXX seems to be ignored on Windows, but specify it anyway for consistency
          - platform_name: windows
            os: windows-2022
            cxx: msvc
            cmake_generator: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          # fetch-depth: 0

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform_name == 'ubuntu'
        run: |
          sudo apt update 
              sudo apt-get install -y \
                      build-essential \
                      pkg-config \
                      libgl1-mesa-dev \
                      libasound2-dev \
                      libxext-dev \
                      libx11-dev \
                      libgtk-3-dev \
                      libsdl2-dev \
                      libgstreamer1.0-dev \
                      libgstreamer-plugins-base1.0-dev \
                      libnotify-dev \
                      libwebkit2gtk-4.1-dev \
                      libcurl4-openssl-dev \
                      libsecret-1-dev \
                      libmspack-dev \
                      libayatana-appindicator3-dev

      - name: Install CMake
        if: matrix.platform_name == 'ubuntu'
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 4.4

      - name: Install Linux Dependencies (Artix-linux)
        if: matrix.platform_name == 'artix-linux'
        run: sudo pacman -Sy base-devel cmake git --noconfirm

      - name: Set up MSVC developer tools
        if: matrix.platform_name == 'windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Add msbuild to PATH
        if: matrix.platform_name == 'windows'
        uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64

      - name: Install CMake via winget
        if: matrix.platform_name == 'windows'
        shell: powershell
        run: |
          choco install cmake -y --quiet
          cmake --version

      # when building on main branch and not a pull request, build and test in release mode (optimised build)
      # - name: Set Build Mode to Release
      #   shell: bash
      #   if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      #   run: echo "BUILD_TYPE=Release" >> $GITHUB_ENV

      # when building on main branch and not a pull request, build and test in release mode (optimised build)
      - name: Set Build Mode to Debug
        shell: bash
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "BUILD_TYPE=Debug" >> $GITHUB_ENV

      - name: Configure CMake
        env:
          CXX: ${{ matrix.cxx }}
        # Use a bash shell so we can use the same syntax for environment variable
        # access regardless of the host operating system
        shell: bash
        working-directory: ${{github.workspace}}
        # Note the current convention is to use the -S and -B options here to specify source 
        # and build directories, but this is only available with CMake 3.13 and higher.  
        # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
        run: |
          cmake -DCMAKE_BUILD_TYPE=Debug \
                -DBUILD_TESTING=ON \
                -DSIMPLEUTILS_BUILD_TESTS:BOOL=ON \
                -DUIUTILS_BUILD_TESTS:BOOL=ON \
                -DUIUTILS_BUILD_GUI_TESTS:BOOL=ON \
                -DSIMPLEUTILS_FETCH_GTEST=ON \
                -DUIUTILS_FETCH_GTEST=ON \
                -DUIUTILS_BUILD_SAMPLE=OFF -S . -B build

      - name: Verify test options
        run: grep -E 'SIMPLEUTILS_BUILD_TESTS|UIUTILS_BUILD_TESTS|UIUTILS_BUILD_GUI_TESTS' build/CMakeCache.txt

      - name: Build
        working-directory: ${{github.workspace}}
        shell: bash
        # Execute the build.  You can specify a specific target with "--target <NAME>"
        run: cmake --build build --config Debug -j4

      - name: Upload Windows artifact
        if: matrix.platform_name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: library-windows
          path: |
            build/uiutils/**/*.dll
            build/uiutils/**/*.lib
            build/backendutils/**/*.dll
            build/backendutils/**/*.lib

      - name: Upload Linux artifact
        if: matrix.platform_name == 'ubuntu'
        uses: actions/upload-artifact@v4
        with:
          name: library-linux
          path: |
            build/uiutils/**/*.so*
            build/uiutils/**/*.a*
            build/backendutils/**/*.so*
            build/backendutils/**/*.a*

      - name: Running tests
        working-directory: ${{github.workspace}}
        shell: bash
        run: |
          ctest -E "uiutils_gui" --test-dir build/uiutils -C Debug --output-on-failure
          ctest --test-dir build/backendutils -C Debug --output-on-failure

